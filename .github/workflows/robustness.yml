name: Robustness
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # The scanner depends on the C library (e.g. `iswalpha`), and the Rust binding compiles it natively, so the
  # tests run on other common platforms too; the Test workflow covers ubuntu-latest.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
      - run: bun install --frozen-lockfile
      - run: bun run test/ci-setup
      - run: bun run build/ci
      # The packages ship the committed src/, so it must be what grammar.js generates. `git add -N` makes files that
      # generation adds but nobody committed show up in the diff too.
      - run: git add --intent-to-add -- src/ && git diff --exit-code -- src/
      - run: bun run test/ci
  # Runs the parser under libFuzzer with AddressSanitizer and UndefinedBehaviorSanitizer, seeded with the
  # input of each corpus case. A grammar change alters which tokens the scanner is asked for, so it runs
  # on every change, not only on scanner changes. The parser runs on WillBooster/tree-sitter at the
  # willbooster-tree-sitter version in Cargo.lock, the runtime the Rust tests use: the error recovery of
  # upstream's runtime never ends on some inputs.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: runtime
        run: |
          version=$(script/runtime-version)
          echo "ref=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: WillBooster/tree-sitter
          ref: ${{ steps.runtime.outputs.ref }}
          path: .tmp/tree-sitter
          persist-credentials: false
      # tree-sitter/fuzz-action can only build upstream's runtime, so only its harness and sanitizer ignore list are
      # used, and its build is reproduced below.
      - uses: actions/checkout@v7.0.1
        with:
          repository: tree-sitter/fuzz-action
          ref: v4
          path: .tmp/fuzz-action
          persist-credentials: false
      - run: |
          mkdir -p .tmp/fuzz-seeds
          # Perl keeps the NUL characters of test/corpus/nul_characters.txt, at which some awk implementations (e.g.
          # macOS's) end a line.
          perl -ne '
            if ($state != 2 && /^=+$/) { open $seed, ">", sprintf(".tmp/fuzz-seeds/%d", ++$n) or die $! if ++$state == 2; next }
            if ($state == 2 && /^---+$/) { $state = 0; close $seed; next }
            print $seed $_ if $state == 2;
          ' $(find test/corpus -name '*.txt' | LC_ALL=C sort)
      - name: Build the fuzzer
        run: |
          jq '.. | select((.type? == "STRING" or (.type? == "ALIAS" and .named? == false)) and .value? != "") | .value' \
            src/grammar.json | grep -v '\\' | iconv -c -f UTF-8 -t ASCII//TRANSLIT > .tmp/fuzz-dict
          # Like tree-sitter/fuzz-action, only the grammar is instrumented, not the runtime.
          clang -std=c11 -Og -g -c -D_POSIX_C_SOURCE=200112L -D_DEFAULT_SOURCE -I.tmp/tree-sitter/lib/include \
            -I.tmp/tree-sitter/lib/src .tmp/tree-sitter/lib/src/lib.c -o .tmp/tree-sitter.o
          clang -std=c11 -Og -g -fsanitize=fuzzer,address,undefined \
            -fsanitize-ignorelist=.tmp/fuzz-action/ignorelist.ini -I.tmp/tree-sitter/lib/include -Isrc \
            -DTS_LANG="tree_sitter_$(jq -r .name src/grammar.json)" .tmp/fuzz-action/fuzzer.c src/parser.c \
            $(ls src/scanner.c 2> /dev/null) .tmp/tree-sitter.o -o .tmp/fuzzer
      - name: Fuzz
        run: |
          mkdir -p .tmp/fuzz-out .tmp/fuzz-artifacts
          .tmp/fuzzer .tmp/fuzz-out .tmp/fuzz-seeds -dict=.tmp/fuzz-dict -artifact_prefix=.tmp/fuzz-artifacts/ \
            -timeout=10 -max_total_time=300 -max_len=4096
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: fuzzer-artifacts
          path: .tmp/fuzz-artifacts/
          retention-days: 7
